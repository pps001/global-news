name: Update news

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch headlines from GDELT
        run: python scripts/fetch_news.py news.json

      - name: Commit news.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update news $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
