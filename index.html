<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World News Globe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@300;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: full-bleed space scene, globe centred; news cards float beside the focused country,
     country index on the left, headline ticker along the bottom. Single dark theme by choice. */
  --space: #030812;
  --ink: #e6f0ff;
  --muted: #8ea3c2;
  --accent: #5cc8ff;
  --accent-soft: rgba(92, 200, 255, 0.16);
  --panel: rgba(8, 20, 40, 0.72);
  --line: rgba(140, 200, 255, 0.28);
  --font-display: "Saira", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--space);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#stage { position: fixed; inset: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#globe { cursor: grab; touch-action: none; }
#globe.dragging { cursor: grabbing; }
#links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

header {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 18px 24px; pointer-events: none;
}
.brand { display: flex; align-items: baseline; gap: 14px; }
.brand h1 {
  margin: 0; font-family: var(--font-display); font-weight: 300;
  font-size: 22px; letter-spacing: 0.32em; text-transform: uppercase;
}
.brand h1 b { font-weight: 600; color: var(--accent); }
#clock { font-family: var(--font-display); color: var(--muted); font-size: 14px; letter-spacing: 0.12em; font-variant-numeric: tabular-nums; }
.controls { display: flex; gap: 10px; align-items: center; pointer-events: auto; }
.badge {
  font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--muted); background: var(--panel); white-space: nowrap;
}
.badge .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #e0b14a; margin-right: 7px; vertical-align: 1px; }
.badge.live .dot { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
button {
  font: 500 13px var(--font-body); color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
#music[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:focus-visible, .chip:focus-visible, .tick a:focus-visible, .card a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#index {
  position: absolute; left: 24px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 4px; max-height: 70%; overflow-y: auto;
  padding-right: 6px;
}
#index .label { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.24em; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
.chip {
  display: flex; align-items: center; gap: 10px; text-align: left;
  font: 400 13px var(--font-body); color: var(--muted);
  background: transparent; border: 0; border-left: 2px solid transparent;
  border-radius: 0; padding: 4px 10px; cursor: pointer;
}
.chip .code { font-family: var(--font-display); font-weight: 600; font-size: 11px; letter-spacing: 0.1em; color: var(--accent); width: 30px; }
.chip .n { margin-left: auto; font-size: 11px; opacity: 0.7; font-variant-numeric: tabular-nums; }
.chip:hover { color: var(--ink); }
.chip.on { color: var(--ink); border-left-color: var(--accent); background: var(--accent-soft); }

.card {
  position: absolute; width: 340px; max-width: calc(100vw - 32px);
  background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 14px 16px 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.06);
  opacity: 0; transform: translateY(8px) scale(0.98);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.card.show { opacity: 1; transform: none; }
.card .top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.card .code { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0.14em; color: var(--space); background: var(--accent); padding: 1px 6px; border-radius: 2px; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 19px; letter-spacing: 0.04em; text-wrap: balance; }
.card ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.card li { border-top: 1px solid rgba(140, 200, 255, 0.12); padding-top: 9px; }
.card li:first-child { border-top: 0; padding-top: 0; }
.card a { color: var(--ink); text-decoration: none; line-height: 1.35; display: block; }
.card li:first-child a { font-size: 16px; font-weight: 500; }
.card li:not(:first-child) a { font-size: 13.5px; color: #c9d8ee; }
.card a:hover { color: var(--accent); }
.card .meta { margin-top: 3px; font-size: 11.5px; color: var(--muted); letter-spacing: 0.02em; }

#ticker {
  position: absolute; left: 0; right: 0; bottom: 0; height: 40px; overflow: hidden;
  border-top: 1px solid var(--line); background: linear-gradient(to top, rgba(3,8,18,0.95), rgba(3,8,18,0.6));
  display: flex; align-items: center;
}
#ticker .tag { flex: none; height: 100%; display: flex; align-items: center; padding: 0 16px; font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0.22em; color: var(--space); background: var(--accent); }
#ticker .viewport { flex: 1; min-width: 0; overflow: hidden; }
#ticker .track { width: max-content; display: flex; gap: 0; white-space: nowrap; animation: scroll 140s linear infinite; }
#ticker:hover .track { animation-play-state: paused; }
.tick { display: inline-flex; align-items: center; gap: 8px; padding: 0 22px; font-size: 13.5px; }
.tick b { font-family: var(--font-display); font-weight: 600; font-size: 11px; letter-spacing: 0.12em; color: var(--accent); }
.tick a { color: var(--ink); text-decoration: none; cursor: pointer; }
.tick a:hover { color: var(--accent); }
.tick .src { color: var(--muted); font-size: 12px; }
@keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

#hint { position: absolute; right: 24px; bottom: 56px; font-size: 12px; color: var(--muted); text-align: right; line-height: 1.6; pointer-events: none; }
#status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--muted); font-family: var(--font-display); letter-spacing: 0.2em; font-size: 13px; text-transform: uppercase; }

@media (max-width: 760px) {
  #index { display: none; }
  .card { width: calc(100vw - 32px); }
  #hint { display: none; }
  .brand h1 { font-size: 16px; letter-spacing: 0.2em; }
  #clock { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  #ticker .track { animation-duration: 600s; }
  .card { transition: none; }
}
</style>
</head>

<div id="stage">
  <canvas id="bg"></canvas>

<header>

    <button id="pause" type="button" aria-pressed="false">Pause</button>
  </div>

async function loadFeed() {
  const res = await fetch("news.json", { cache: "no-store" });
  if (!res.ok) throw new Error("news.json not found (" + res.status + ")");
  const data = await res.json();
  let n = 0;
  Object.entries(data.countries || {}).forEach(([iso, items]) => {
    const c = byIso.get(iso); if (!c || !items || !items.length) return;
    c.items = items.slice(0, 3).map(i => ({ t: i.t, s: i.s, d: fmtIso(i.d), u: i.u })); c.live = true; n++;
  });
  if (!n) throw new Error("news.json has no headlines yet");
  liveCount = n;
  const when = fmtIso(data.updated);
  modeEl.classList.add("live");
  modeText.textContent = "Live · " + n + " countries";
  modeEl.title = "Newest articles from each country's press via GDELT, collected " + (when || "recently") + " by this site's GitHub Action.";
  renderIndex(); refreshCards(); tickerDirty = true;
}
function snapshotBecause(reason) {
  console.info("Live news unavailable, showing snapshot:", reason);
  modeEl.title = "Showing headlines gathered on " + SNAPSHOT_DATE + ". Live news unavailable: " + reason;
}
async function tryLive() {
  try {
    await loadFeed(); renderTicker();
    setInterval(() => loadFeed().catch(e => console.info("news.json refresh failed:", e.message)), FEED_POLL_MS);
    return;
  } catch (e) { console.info("No usable news.json:", e.message); }
  // Fallback: ask GDELT straight from the browser (works only where GDELT allows it).
  try { await liveCycle(); }
  catch (e) { snapshotBecause("GDELT refused requests from this page (" + e.message + "). Add the GitHub Action to fix this."); }
}

/* ---------- Background music ---------------------------------------------------------
   Easy-listening ambient made live with Web Audio: warm pad chords
   (Cmaj9 → Am9 → Fmaj9 → G6/9), a soft bass, and sparse bell-like notes through reverb
   and echo. Browsers only allow sound after a click or key press, so it starts on the
   first interaction unless the viewer has turned it off.                                 */
const Music = (() => {
  const CHORDS = [
    { bass: 36, pad: [60, 64, 67, 71, 74] },   // Cmaj9
    { bass: 33, pad: [57, 60, 64, 67, 71] },   // Am9
    { bass: 29, pad: [53, 57, 60, 64, 67] },   // Fmaj9
    { bass: 31, pad: [55, 59, 62, 64, 69] },   // G6/9
  ];
  const BELL = [72, 74, 76, 79, 81, 84, 86, 88];   // C major pentatonic, upper register
  const BAR = 8;                                    // seconds per chord
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  let ac, master, bus, echo, timer, nextChord = 0, chordIdx = 0, nextBell = 0, on = false, started = false;

  function impulse(seconds, decay) {
    const len = ac.sampleRate * seconds, buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return buf;
  }
  function build() {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -18; comp.connect(master);
    const rev = ac.createConvolver(); rev.buffer = impulse(4.5, 2.6);
    const wet = ac.createGain(); wet.gain.value = 0.55; rev.connect(wet).connect(comp);
    const dry = ac.createGain(); dry.gain.value = 0.6; dry.connect(comp);
    bus = ac.createGain(); bus.connect(dry); bus.connect(rev);
    echo = ac.createDelay(2); echo.delayTime.value = 0.75;
    const fb = ac.createGain(); fb.gain.value = 0.38; const tone = ac.createBiquadFilter(); tone.type = "lowpass"; tone.frequency.value = 2200;
    echo.connect(tone).connect(fb).connect(echo); tone.connect(bus);
  }
  function pad(chord, t) {
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.setValueAtTime(500, t);
    lp.frequency.linearRampToValueAtTime(1100, t + BAR * 0.5); lp.frequency.linearRampToValueAtTime(600, t + BAR + 2);
    const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.05, t + 2.5);
    g.gain.setValueAtTime(0.05, t + BAR - 1); g.gain.linearRampToValueAtTime(0, t + BAR + 2.5);
    lp.connect(g).connect(bus);
    chord.pad.forEach(m => [-6, 6].forEach(cents => {
      const o = ac.createOscillator(); o.type = "triangle"; o.frequency.value = hz(m); o.detune.value = cents;
      o.connect(lp); o.start(t); o.stop(t + BAR + 3);
    }));
    const b = ac.createOscillator(), bg = ac.createGain(); b.type = "sine"; b.frequency.value = hz(chord.bass);
    bg.gain.setValueAtTime(0, t); bg.gain.linearRampToValueAtTime(0.09, t + 1.5); bg.gain.setValueAtTime(0.09, t + BAR - 1); bg.gain.linearRampToValueAtTime(0, t + BAR + 1.5);
    b.connect(bg).connect(bus); b.start(t); b.stop(t + BAR + 2);
  }
  function bell(m, t) {
    const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.045, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
    const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = hz(m);
    const o2 = ac.createOscillator(); o2.type = "sine"; o2.frequency.value = hz(m) * 2.01;
    const g2 = ac.createGain(); g2.gain.value = 0.25;
    o.connect(g); o2.connect(g2).connect(g); g.connect(bus); g.connect(echo);
    o.start(t); o2.start(t); o.stop(t + 3.4); o2.stop(t + 3.4);
  }
  function schedule() {
    const ahead = ac.currentTime + 1.5;
    while (nextChord < ahead) { pad(CHORDS[chordIdx % CHORDS.length], nextChord); chordIdx++; nextChord += BAR; }
    while (nextBell < ahead) {
      if (Math.random() < 0.55) {
        const chord = CHORDS[(chordIdx - 1 + CHORDS.length) % CHORDS.length];
        const tones = BELL.filter(m => chord.pad.some(p => (p - m) % 12 === 0));
        const pool = Math.random() < 0.7 && tones.length ? tones : BELL;
        bell(pool[Math.floor(Math.random() * pool.length)], nextBell);
      }
      nextBell += [0.75, 1.5, 1.5, 2.25][Math.floor(Math.random() * 4)];
    }
  }
  async function start() {
    if (!ac) build();
    try { await ac.resume(); } catch (e) { return false; }
    if (!started) { started = true; nextChord = ac.currentTime + 0.1; nextBell = ac.currentTime + 3; }
    clearInterval(timer); schedule(); timer = setInterval(schedule, 250);
    master.gain.cancelScheduledValues(ac.currentTime);
    master.gain.setValueAtTime(master.gain.value, ac.currentTime);
    master.gain.linearRampToValueAtTime(0.8, ac.currentTime + 3);
    on = true; return true;
  }
  function stop() {
    if (!ac) return; on = false;
    master.gain.cancelScheduledValues(ac.currentTime);
    master.gain.setValueAtTime(master.gain.value, ac.currentTime);
    master.gain.linearRampToValueAtTime(0, ac.currentTime + 1.2);
    setTimeout(() => { if (!on) { clearInterval(timer); ac.suspend(); } }, 1300);
  }
  return { start, stop, get on() { return on; } };
})();

const musicBtn = document.getElementById("music");
let musicWanted = true;   // play by default once the browser allows it
function showMusic() { musicBtn.textContent = Music.on ? "Music: on" : "Music: off"; musicBtn.setAttribute("aria-pressed", String(Music.on)); }
musicBtn.addEventListener("click", async e => {
  e.stopPropagation();
  musicWanted = !Music.on;
  if (musicWanted) await Music.start(); else Music.stop();
  showMusic();
});
async function firstGesture(e) {
  if (e && e.target === musicBtn) return;   // the button handles its own click
  removeEventListener("pointerdown", firstGesture, true); removeEventListener("keydown", firstGesture, true);
  if (musicWanted && !Music.on) { await Music.start(); showMusic(); }
}
addEventListener("pointerdown", firstGesture, true);
addEventListener("keydown", firstGesture, true);

/* ---------- Start ---------------------------------------------------------------- */
resize();
renderLists();
requestAnimationFrame(frame);
loadWorld().then(w => {
  world = w;
  document.getElementById("status").remove();
  if (!w.features.length) console.warn("No country shapes loaded; showing markers only.");
});
tryLive();
</script>
